[package]
name = "pcap-converter"
version = "0.2.5"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.42", features = ["derive"] }
etherparse = "0.19.0"
pcap-parser = { version = "0.17.0", features = ["data"] }
chrono = "0.4.39"
domain = "0.11.0"
num-format = "0.4.4"
arrow = "57.3"
parquet = "57.3"
ntp-parser = "0.6.0"
rand = "0.10"
duckdb = { version = "1.4", features = ["bundled"] }
#duckdb = "1.3.2"
crossbeam = "0.8"
# env_logger = "0.11.5"
log = "0.4.27"
serde_json = "1.0.142"
tracing = { version = "0.1.41", features = ["attributes"] }
tracing-appender = "0.2.3"
tracing-subscriber = "0.3.19"
